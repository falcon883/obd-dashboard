version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These three have to move together, or `npm ci` fails on peer dependencies.
      vite-stack:
        patterns: ["vite", "vitest", "@vitejs/*"]
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*"]
    ignore:
      # eslint-plugin-react does not support ESLint 10 yet. Remove this once it does.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
