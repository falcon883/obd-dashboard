[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obd-dashboard"
version = "1.0.0"
description = "Live OBD-II dashboard and logger for ELM327 adapters (read-only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "obd>=0.7.1",
    "pyserial>=3.5",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
obd-dashboard = "obd_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obd_dashboard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "PTH"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for Python 3.10

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src"]
